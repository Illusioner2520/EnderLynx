name: Build & Attach Release Artifacts

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    env:
      NPM_CONFIG_ALLOW_GIT: all

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run macOS install scripts
        if: runner.os == 'macOS'
        run: npm rebuild macos-alias fs-xattr

      - name: Install Rust
        if: runner.os == 'Windows'
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Add NSIS to PATH
        if: runner.os == 'Windows'
        run: echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
        shell: powershell

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            libgtk-3-dev \
            libnss3 \
            libxss1 \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libgbm1 \
            libxkbcommon0 \
            fakeroot \
            dpkg \
            rpm

      - name: Run build script Windows
        if: runner.os == 'Windows'
        run: npm run build:windows

      - name: Run build script Linux
        if: runner.os == 'Linux'
        run: npm run build:linux

      - name: Run build script MacOS
        if: runner.os == 'macOS'
        run: npm run build:macos

      - name: Rename Windows artifacts
        if: runner.os == 'Windows'
        run: |
          $RELEASE_TAG = "${{ github.ref_name }}"
          $RELEASE_TAG = $RELEASE_TAG.TrimStart('v')
          Rename-Item -Path "installer/EnderLynxInstaller.exe" -NewName "EnderLynx-Setup-windows-x64-$RELEASE_TAG.exe"
          Get-ChildItem -Path '.\out\make' -Recurse -File -Include '*.zip' | Rename-Item -NewName "EnderLynx-windows-x64-$RELEASE_TAG.zip"
        shell: powershell

      - name: Rename Linux artifacts
        if: runner.os == 'Linux'
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME#v}";
          mkdir -p dist
          find ./out/make -type f -name '*.zip' -exec mv {} "./dist/EnderLynx-linux-x64-${RELEASE_TAG}.zip" \;
          find ./out/make -type f -name '*.deb' -exec mv {} "./dist/EnderLynx-linux-x64-${RELEASE_TAG}.deb" \;
          find ./out/make -type f -name '*.rpm' -exec mv {} "./dist/EnderLynx-linux-x64-${RELEASE_TAG}.rpm" \;
        shell: bash

      - name: Rename Mac artifacts
        if: runner.os == 'macOS'
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME#v}";
          mkdir -p dist
          find ./out/make -type f -name '*.zip' -exec mv {} "./dist/EnderLynx-macos-universal-${RELEASE_TAG}.zip" \;
          find ./out/make -type f -name '*.dmg' -exec mv {} "./dist/EnderLynx-macos-universal-${RELEASE_TAG}.dmg" \;
        shell: bash

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/*.exe
            out/make/**/*.zip
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
